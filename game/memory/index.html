<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:22px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .score-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
    .score-box { font-size:15px; color:var(--muted); background:#16161b; border:1px solid var(--line); border-radius:10px; padding:8px 12px; flex:1; text-align:center; }
    .score-box b { color:var(--accent); font-size:18px; margin-left:4px; }
    .board { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:10px; }
    .card { aspect-ratio:1; border-radius:10px; font-size:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; background:linear-gradient(135deg,#3a3a44,#475569); transition:transform .18s, background .18s; }
    .card:hover { transform:scale(1.04); }
    .card.flip { background:linear-gradient(135deg,#16161b,#24242b); border:1px solid var(--line); }
    .card.match { background:linear-gradient(135deg,#064e3b,#065f46); border:1px solid #22c55e; cursor:default; }
    .card.match:hover { transform:scale(1); }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    .btn { background:var(--accent); color:#052e16; border:none; padding:8px 20px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover { filter:brightness(1.1); }
    .diff-row { display:flex; gap:8px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 0; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(2,6,23,.8); border-radius:8px; }
    .overlay h2 { font-size:26px; }
    .wrap { position:relative; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>🎴 记忆翻牌</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="score-row">
            <div class="score-box">⏱ 用时 <b id="time">0</b></div>
            <div class="score-box">🎯 步数 <b id="moves">0</b></div>
            <div class="score-box">🏆 最少 <b id="best">-</b></div>
        </div>
        <div class="wrap">
            <div class="board" id="board"></div>
            <div class="overlay" id="overlay" style="display:none">
                <h2 id="ovTitle">开始</h2>
                <div class="diff-row">
                    <button class="dbtn" data-d="easy">简单</button>
                    <button class="dbtn" data-d="normal">普通</button>
                    <button class="dbtn" data-d="hard">困难</button>
                </div>
                <button class="btn" id="start">开始游戏</button>
            </div>
        </div>
        <div class="hint">翻开两张牌，找出所有相同的图案配对 · 用时越短、步数越少越好</div>
    </div>

<script>
(function () {
    var PAIRS = ["🍎", "🍌", "🍇", "🍉", "🍓", "🍑", "🍒", "🥝", "🍍", "🥭", "🍋", "🫐"];

    // 难度：影响牌的对数（简单 6 对 / 普通 8 对 / 困难 12 对）
    var DIFFS = { easy:{pairs:6}, normal:{pairs:8}, hard:{pairs:12} };
    var diffKey = localStorage.getItem("memory_diff") || "normal";
    function initDiff() {
        var btns = document.querySelectorAll(".dbtn");
        btns.forEach(function (b) {
            if (b.dataset.d === diffKey) b.classList.add("on");
            b.addEventListener("click", function () {
                diffKey = b.dataset.d;
                localStorage.setItem("memory_diff", diffKey);
                btns.forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
            });
        });
    }

    var boardEl = document.getElementById("board");
    var timeEl = document.getElementById("time"), movesEl = document.getElementById("moves"),
        bestEl = document.getElementById("best"), overlay = document.getElementById("overlay"),
        ovTitle = document.getElementById("ovTitle");

    var cards, first, second, moves, sec, timer, lock, started;

    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }

    function build() {
        var used = PAIRS.slice(0, DIFFS[diffKey].pairs);
        var icons = shuffle(used.concat(used));
        boardEl.innerHTML = "";
        cards = [];
        icons.forEach(function (icon, idx) {
            var d = document.createElement("div");
            d.className = "card";
            d.dataset.icon = icon;
            d.addEventListener("click", function () { flip(idx); });
            boardEl.appendChild(d);
            cards.push({ el: d, icon: icon, matched: false });
        });
    }

    function reset() {
        sec = 0; moves = 0; started = false; first = second = null; lock = false;
        timeEl.textContent = 0; movesEl.textContent = 0;
        clearInterval(timer);
        build();
        overlay.style.display = "none";
        ovTitle.textContent = "🎴 记忆翻牌";
        document.getElementById("start").textContent = "开始游戏";
    }

    function flip(idx) {
        if (lock) return;
        var c = cards[idx];
        if (c.matched || c.el.classList.contains("flip")) return;
        if (!started) {
            // 首次翻牌开始计时
            started = true;
            timer = setInterval(function () { sec++; timeEl.textContent = sec; }, 1000);
        }
        c.el.classList.add("flip");
        c.el.textContent = c.icon;
        if (!first) { first = c; return; }
        second = c;
        moves++; movesEl.textContent = moves;
        lock = true;
        setTimeout(check, 550);
    }

    function check() {
        if (first.icon === second.icon) {
            first.matched = second.matched = true;
            first.el.classList.add("match"); second.el.classList.add("match");
        } else {
            first.el.classList.remove("flip"); first.el.textContent = "";
            second.el.classList.remove("flip"); second.el.textContent = "";
        }
        first = second = null; lock = false;
        if (cards.every(function (c) { return c.matched; })) end();
    }

    function end() {
        clearInterval(timer);
        overlay.style.display = "flex";
        ovTitle.textContent = "全部配对成功！用时 " + sec + " 秒 · " + moves + " 步";
        document.getElementById("start").textContent = "再来一局";
        var key = "memory_best_" + diffKey;
        var b = +(localStorage.getItem(key) || 99999);
        if (moves < b) { localStorage.setItem(key, moves); b = moves; }
        bestEl.textContent = b === 99999 ? "-" : b + "步";
    }

    document.getElementById("start").addEventListener("click", reset);

    initDiff();
    reset();
    // 显示开始遮罩（含难度选择），点击"开始游戏"后才开始计时
    overlay.style.display = "flex";
    var b0 = +(localStorage.getItem("memory_best_" + diffKey) || 99999);
    bestEl.textContent = b0 === 99999 ? "-" : b0 + "步";
})();
</script>
</body>
</html>
