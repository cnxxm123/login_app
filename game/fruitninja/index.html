<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水果忍者</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:780px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:24px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { width:100%; max-width:780px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .stat-row { display:flex; gap:10px; margin-bottom:14px; }
    .stat { flex:1; background:#16161b; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
    .stat .label { font-size:12px; color:var(--muted); }
    .stat .val { font-size:24px; font-weight:700; color:var(--accent); }
    .wrap { position:relative; }
    /* 横屏 16:9 画布：禁止触摸滚动、禁止长按菜单、十字光标，方便滑动切水果 */
    #board { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; border-radius:12px;
        background:#0c1425; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(2,6,23,.86); border-radius:12px; text-align:center; padding:14px; }
    .overlay h2 { font-size:26px; }
    .overlay .desc { font-size:13px; color:var(--muted); line-height:1.8; }
    .overlay .best { font-size:13px; color:var(--accent); font-weight:700; }
    .diff-row { display:flex; gap:10px; width:100%; max-width:340px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 0; font-size:14px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
    .btn { background:var(--accent); color:#052e16; border:none; padding:12px 36px; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; touch-action:manipulation; }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    /* 竖屏手机上的横屏提示：仅窄屏+竖屏时显示，不拦截触摸 */
    .rotate-hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:13px; color:var(--muted);
        background:rgba(2,6,23,.6); padding:6px; pointer-events:none; display:none; }
    @media (max-width:640px) and (orientation:portrait) { .rotate-hint { display:block; } }
</style>
</head>
<body>
    <div class="topbar">
        <h1>🍉 水果忍者</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="stat-row">
            <div class="stat"><div class="label">得分</div><div class="val" id="score">0</div></div>
            <div class="stat"><div class="label">连击</div><div class="val" id="combo">-</div></div>
            <div class="stat"><div class="label">时间</div><div class="val" id="time">60</div></div>
            <div class="stat"><div class="label">最佳</div><div class="val" id="best">0</div></div>
        </div>
        <div class="wrap">
            <canvas id="board"></canvas>
            <div class="rotate-hint">📱 竖屏画面较窄，横屏游玩体验更佳</div>
            <div class="overlay" id="overlay">
                <h2 id="ovTitle">🍉 水果忍者</h2>
                <div class="desc" id="ovDesc">用手指/鼠标在水果上滑动切开它们！<br>🍉🍊🍎 得分 · 💣 千万别切到 · 漏掉 3 个或切到炸弹即失败</div>
                <div class="best" id="ovBest"></div>
                <div class="diff-row">
                    <button class="dbtn" data-d="easy">简单</button>
                    <button class="dbtn" data-d="normal">普通</button>
                    <button class="dbtn" data-d="hard">困难</button>
                </div>
                <button class="btn" id="start">开始游戏</button>
            </div>
        </div>
        <div class="hint">在水果上滑动切开它们 · 一次连切多个有连击加分 · 60 秒内尽力拿高分 · 手机/电脑均可滑动</div>
    </div>

<script>
(function () {
    "use strict";

    /* ============ 1. 画布初始化与高清适配 ============
       逻辑坐标系固定为 800x450（横屏 16:9，水果自下而上飞出）。
       按设备像素比(DPR)放大画布物理分辨率，CSS 显示尺寸不变，
       让高分屏/手机上的画面更清晰不发虚（上限 3 倍避免开销过大）。 */
    var W = 800, H = 450;
    var cv = document.getElementById("board"), ctx = cv.getContext("2d");
    var DPR = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.scale(DPR, DPR);

    /* ============ 2. 游戏常量 ============ */
    var GRAVITY = 1300;   // 重力加速度（像素/秒²），决定水果抛物线的弧度（低一些可飞得更高）
    var DURATION = 60;    // 一局时长（秒）
    var MISS_LIMIT = 3;   // 漏掉 3 个水果即失败

    /* ============ 3. 难度配置 ============
       简单：生成慢、炸弹少、水果慢
       普通：均衡
       困难：生成快、炸弹多、水果快、且一次可能飞出 2~3 个（制造连击机会） */
    var DIFFS = {
        easy:   { spawnInterval: 0.95, bombChance: 0.10, speedMul: 0.75, burst: [1] },
        normal: { spawnInterval: 0.70, bombChance: 0.16, speedMul: 1.00, burst: [1, 1, 2] },
        hard:   { spawnInterval: 0.50, bombChance: 0.23, speedMul: 1.25, burst: [1, 2, 2, 3] }
    };
    var diffKey = localStorage.getItem("fruit_ninja_diff") || "normal";

    /* ============ 4. DOM 引用 ============ */
    var scoreEl = document.getElementById("score"), comboEl = document.getElementById("combo"),
        timeEl = document.getElementById("time"), bestEl = document.getElementById("best"),
        overlay = document.getElementById("overlay"), ovTitle = document.getElementById("ovTitle"),
        ovDesc = document.getElementById("ovDesc"), ovBest = document.getElementById("ovBest"),
        startBtn = document.getElementById("start");

    /* ============ 5. 水果类型表 ============
       e=表情符号（果皮）  r=半径  pts=得分  color=果汁/果肉颜色  w=随机权重（越大越常见） */
    var FRUITS = [
        { e: "🍉", r: 44, pts: 3, color: "#ff5252", w: 12 },
        { e: "🍊", r: 34, pts: 2, color: "#ffa726", w: 14 },
        { e: "🍎", r: 34, pts: 2, color: "#ef5350", w: 14 },
        { e: "🍋", r: 30, pts: 1, color: "#ffee58", w: 12 },
        { e: "🍓", r: 28, pts: 1, color: "#ff5252", w: 12 },
        { e: "🥝", r: 32, pts: 2, color: "#66bb6a", w: 10 },
        { e: "🍑", r: 34, pts: 2, color: "#ffab91", w: 12 },
        { e: "🍇", r: 32, pts: 2, color: "#ab47bc", w: 10 }
    ];
    var BOMB = { e: "💣", r: 38, pts: 0, color: "#ff7043", bomb: true };

    /* ============ 6. 游戏状态 ============ */
    var fruits = [], pieces = [], parts = [], popups = [], rings = []; // 水果/半片/果汁粒子/弹字/波纹
    var trail = [];        // 刀光轨迹点 {x,y,t}
    var dragging = false;  // 当前是否正在滑动
    var playing = false;
    var score = 0, comboHits = 0, comboPts = [], missed = 0; // 得分/本次滑动连切数/连切位置/漏掉数
    var gameTime = DURATION, spawnTimer = 0;
    var shakeT = 0;        // 切到炸弹时的震屏剩余时间（秒）
    var lastT = -1, lastSlash = 0;

    /* ============ 7. Web Audio 音效（合成，无需音频文件）============
       所有音效都用振荡器 + 噪声缓冲实时合成，浏览器首次用户手势后创建 AudioContext。 */
    var S = (function () {
        var ac = null, noiseBuf = null;
        function ctx() {
            if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
            return ac;
        }
        function resume() { if (ac && ac.state === "suspended") ac.resume(); }
        // 振荡器音（用于"叮/嘀"类短音、组合上升音阶、结束音）
        function tone(f, dur, type, vol, when) {
            var c = ctx(), t = c.currentTime + (when || 0);
            var o = c.createOscillator(), g = c.createGain();
            o.type = type || "sine"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(c.destination);
            o.start(t); o.stop(t + dur + 0.05);
        }
        // 噪声音（用于"嗖/切/炸"类音，带滤波器扫频）
        function noise(dur, f0, f1, vol, type) {
            var c = ctx(), t = c.currentTime;
            if (!noiseBuf) { // 生成一段随机白噪声，可重复使用
                var len = c.sampleRate * 0.4, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
                for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
                noiseBuf = b;
            }
            var s = c.createBufferSource(); s.buffer = noiseBuf;
            var f = c.createBiquadFilter(); f.type = type || "bandpass"; f.Q.value = 1.1;
            f.frequency.setValueAtTime(f0, t);
            f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
            var g = c.createGain(); g.gain.setValueAtTime(vol || 0.2, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            s.connect(f); f.connect(g); g.connect(c.destination);
            s.start(t); s.stop(t + dur + 0.05);
        }
        return {
            resume: resume,
            slash: function () { noise(0.16, 800, 3000, 0.22); },                              // 挥刀"嗖"
            cut:   function () { noise(0.1, 2400, 4500, 0.25, "highpass"); tone(900, 0.09, "sine", 0.12); }, // 切开"啪"
            miss:  function () { tone(220, 0.15, "triangle", 0.15); tone(180, 0.2, "triangle", 0.12, 0.08); }, // 漏掉
            bomb:  function () { noise(0.6, 500, 60, 0.5, "lowpass"); tone(140, 0.5, "square", 0.25); noise(0.25, 3000, 900, 0.3); }, // 爆炸
            combo: function (n) { var b = 523; for (var i = 0; i < n && i < 6; i++) tone(b * Math.pow(1.25, i), 0.13, "triangle", 0.2, i * 0.06); }, // 连击上升音
            over:  function () { tone(392, 0.18, "triangle", 0.2, 0); tone(294, 0.2, "triangle", 0.18, 0.14); tone(196, 0.45, "triangle", 0.18, 0.3); } // 结束
        };
    })();

    /* ============ 8. 工具函数 ============ */
    // 构造能正确渲染彩色表情的字体串（必须带上各平台的 Emoji 字体族）
    function emojiFont(px) { return px + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; }
    // 点到线段的最短距离（用于判断刀光是否切到水果）
    function segDist(px, py, ax, ay, bx, by) {
        var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
        if (len2 === 0) return Math.hypot(px - ax, py - ay);
        var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
        var cx = ax + t * dx, cy = ay + t * dy;
        return Math.hypot(px - cx, py - cy);
    }
    // 按权重随机选一种水果
    function pickType() {
        var total = 0, i;
        for (i = 0; i < FRUITS.length; i++) total += FRUITS[i].w;
        var r = Math.random() * total;
        for (i = 0; i < FRUITS.length; i++) { r -= FRUITS[i].w; if (r <= 0) return FRUITS[i]; }
        return FRUITS[0];
    }
    // 一次生成的水果个数（连击机会）
    function pickBurst(cfg) { return cfg.burst[Math.floor(Math.random() * cfg.burst.length)]; }
    // 屏幕坐标 → 画布逻辑坐标（画布被 CSS 缩放，需按比例换算）
    function toBoard(e) {
        var r = cv.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    }

    /* ============ 9. 水果生成 ============ */
    function spawnFruit(n) {
        var cfg = DIFFS[diffKey];
        var ramp = 1 + (DURATION - gameTime) / DURATION * 0.4; // 随时间逐渐加速，越玩越刺激
        for (var k = 0; k < n; k++) {
            var isBomb = Math.random() < cfg.bombChance;
            var t = isBomb ? BOMB : pickType();
            var x = W * 0.12 + Math.random() * W * 0.76;           // 横向随机
            var vy = -(cfg.speedMul * ramp * (850 + Math.random() * 400)); // 向上初速（较高，水果能飞到屏幕中上部）
            var vx = (Math.random() * 2 - 1) * 240;                // 横向漂移
            fruits.push({
                x: x, y: H + t.r + 12, vx: vx, vy: vy,
                r: t.r, emoji: t.e, color: t.color, pts: t.pts,
                bomb: !!t.bomb, rot: Math.random() * Math.PI * 2, vrot: (Math.random() * 2 - 1) * 7,
                cut: false
            });
        }
    }

    /* ============ 10. 切割逻辑 ============ */
    // 检测刀光线段 a->b 与每个水果是否相交（距离小于半径即命中）
    function checkCut(a, b) {
        var dx = b.x - a.x, dy = b.y - a.y;
        if (Math.hypot(dx, dy) < 6) return; // 过滤原地点击/抖动，避免"点一下就切"
        var ang = Math.atan2(dy, dx);
        for (var i = fruits.length - 1; i >= 0; i--) {
            var f = fruits[i];
            if (f.y > H + 20) continue; // 刚飞出屏幕底部、还看不见的水果不可切
            if (segDist(f.x, f.y, a.x, a.y, b.x, b.y) <= f.r) cutFruit(f, ang);
            if (!playing) return; // 若切到炸弹已结束游戏，停止继续切割
        }
    }
    function cutFruit(f, ang) {
        if (f.bomb) { explodeBomb(f); return; }
        comboHits++; comboPts.push({ x: f.x, y: f.y });
        score += f.pts;
        spawnJuice(f.x, f.y, f.color, 16, ang);  // 果汁飞溅
        spawnRing(f.x, f.y);                     // 切中的白色波纹
        pieces.push(makeHalf(f, 1, ang), makeHalf(f, -1, ang)); // 裂成两半
        addPopup(f.x, f.y - f.r, "+" + f.pts, "#ffd54f", 17);
        S.cut();
        if (comboHits >= 2) S.combo(comboHits);
        var i = fruits.indexOf(f); if (i >= 0) fruits.splice(i, 1);
        updateHUD();
    }
    // 切到炸弹：大量橙黄碎片 + 大波纹 + 震屏 + 游戏结束
    function explodeBomb(f) {
        spawnJuice(f.x, f.y, "#ff7043", 30, Math.atan2(1, 0));
        spawnJuice(f.x, f.y, "#fdd835", 14, Math.atan2(1, 0));
        spawnRing(f.x, f.y, 130);
        shakeT = 0.5;
        S.bomb();
        var i = fruits.indexOf(f); if (i >= 0) fruits.splice(i, 1);
        endGame("bomb");
    }
    // 生成"半片"：dir=1 上半、dir=-1 下半，沿挥砍方向垂直分离并逐渐淡出
    function makeHalf(f, dir, ang) {
        var px = -Math.sin(ang), py = Math.cos(ang); // 与挥砍方向垂直的单位向量
        return {
            x: f.x, y: f.y,
            vx: f.vx * 0.4 + px * dir * 180 + (Math.random() * 2 - 1) * 50,
            vy: f.vy * 0.4 + py * dir * 160 + (Math.random() * 2 - 1) * 50,
            rot: f.rot, vrot: f.vrot + (Math.random() * 2 - 1) * 6,
            r: f.r, emoji: f.emoji, color: f.color, dir: dir,
            life: 1.1, max: 1.1
        };
    }

    /* ============ 11. 特效：果汁粒子 / 弹字 / 波纹 ============ */
    function spawnJuice(x, y, color, n, ang) {
        for (var i = 0; i < n; i++) {
            var a = ang + (Math.random() * 2 - 1) * Math.PI * 0.9;
            var sp = 120 + Math.random() * 340;
            var lf = 0.5 + Math.random() * 0.4;
            parts.push({ x: x, y: y, vx: Math.cos(a) * sp + (Math.random() * 2 - 1) * 80,
                vy: Math.sin(a) * sp - 60, r: 2 + Math.random() * 5, color: color, life: lf, max: lf });
        }
    }
    function addPopup(x, y, text, color, size) {
        popups.push({ x: x, y: y, text: text, color: color, vy: -90, life: 0.9, max: 0.9, size: size || 16 });
    }
    function spawnRing(x, y, max) {
        rings.push({ x: x, y: y, r: 8, max: max || 60, life: 0.35, maxLife: 0.35 });
    }

    /* ============ 12. 物理更新（每帧） ============ */
    function update(dt) {
        var i;
        // 水果：重力加速、移动、旋转；掉出底部计"漏掉"
        for (i = fruits.length - 1; i >= 0; i--) {
            var f = fruits[i];
            f.vy += GRAVITY * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vrot * dt;
            if (f.y - f.r > H + 30) {
                fruits.splice(i, 1);
                if (!f.bomb) {
                    missed++; S.miss(); updateHUD();
                    if (missed >= MISS_LIMIT) endGame("miss");
                }
            }
        }
        // 半片：受重力下落、旋转、淡出
        for (i = pieces.length - 1; i >= 0; i--) {
            var p = pieces[i];
            p.vy += GRAVITY * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
            p.life -= dt;
            if (p.life <= 0 || p.y - p.r > H + 40) pieces.splice(i, 1);
        }
        // 果汁粒子
        for (i = parts.length - 1; i >= 0; i--) {
            var q = parts[i];
            q.vy += GRAVITY * dt * 0.6; q.x += q.vx * dt; q.y += q.vy * dt;
            q.life -= dt;
            if (q.life <= 0) parts.splice(i, 1);
        }
        // 弹字
        for (i = popups.length - 1; i >= 0; i--) {
            var u = popups[i];
            u.y += u.vy * dt; u.vy += 140 * dt; u.life -= dt;
            if (u.life <= 0) popups.splice(i, 1);
        }
        // 波纹
        for (i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
        if (shakeT > 0) shakeT -= dt;
    }

    /* ============ 13. 绘制 ============ */
    function drawFruit(f) {
        ctx.save();
        ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.font = emojiFont(f.r * 2);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (f.bomb) { ctx.shadowColor = "rgba(255,90,40,.95)"; ctx.shadowBlur = 20; } // 炸弹红色警示光晕
        else { ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3; }
        ctx.fillText(f.emoji, 0, f.r * 0.1);
        ctx.restore();
    }
    // 半片：裁剪出上半/下半区域，先画果肉颜色再叠果皮 emoji，呈现"切开"效果
    function drawPiece(p) {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.beginPath();
        ctx.rect(-p.r, p.dir > 0 ? -p.r : 0, p.r * 2, p.r);
        ctx.clip();
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.font = emojiFont(p.r * 2);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.emoji, 0, p.r * 0.1);
        ctx.restore();
    }
    // 刀光：连成发光折线，超过 120ms 的轨迹点自动淡出
    function drawBlade() {
        var now = performance.now();
        while (trail.length && now - trail[0].t > 120) trail.shift();
        if (trail.length < 2) return;
        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = 12;
        ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
        for (var i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(160,225,255,.55)"; ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
    }
    function drawParts() {
        for (var i = 0; i < parts.length; i++) {
            var q = parts[i];
            ctx.globalAlpha = Math.max(0, q.life / q.max);
            ctx.fillStyle = q.color;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    function drawPopups() {
        for (var i = 0; i < popups.length; i++) {
            var u = popups[i];
            ctx.globalAlpha = Math.max(0, u.life / u.max);
            ctx.font = "bold " + u.size + 'px "Segoe UI",sans-serif';
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.6)";
            ctx.strokeText(u.text, u.x, u.y);
            ctx.fillStyle = u.color;
            ctx.fillText(u.text, u.x, u.y);
        }
        ctx.globalAlpha = 1;
    }
    function drawRings() {
        for (var i = 0; i < rings.length; i++) {
            var w = rings[i], a = Math.max(0, w.life / w.maxLife);
            var rr = w.r + (w.max - w.r) * (1 - a); // 波纹从内向外扩散
            ctx.globalAlpha = a * 0.9;
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(w.x, w.y, rr, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }
    function draw() {
        ctx.clearRect(0, 0, W, H);
        // 背景：中央偏亮、四周渐暗的径向渐变，营造舞台灯光感
        var g = ctx.createRadialGradient(W / 2, H * 0.32, 60, W / 2, H * 0.45, W * 0.72);
        g.addColorStop(0, "#1b2742"); g.addColorStop(1, "#0c1425");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        if (shakeT > 0) ctx.save(); // 震屏：随机偏移整幅画面
        if (shakeT > 0) ctx.translate((Math.random() * 2 - 1) * 6, (Math.random() * 2 - 1) * 6);
        drawBlade();
        for (var i = 0; i < fruits.length; i++) drawFruit(fruits[i]);
        for (i = 0; i < pieces.length; i++) drawPiece(pieces[i]);
        drawParts(); drawRings(); drawPopups();
        if (shakeT > 0) ctx.restore();
    }

    /* ============ 14. 输入（指针事件，鼠标/触屏统一处理） ============ */
    cv.addEventListener("pointerdown", function (e) {
        if (!playing) return;
        S.resume();
        dragging = true;
        var p = toBoard(e);
        trail.length = 0;
        trail.push({ x: p.x, y: p.y, t: performance.now() });
        try { cv.setPointerCapture(e.pointerId); } catch (err) { }
        e.preventDefault();
    });
    cv.addEventListener("pointermove", function (e) {
        if (!dragging || !playing) return;
        var p = toBoard(e), last = trail[trail.length - 1];
        if (last && Math.hypot(p.x - last.x, p.y - last.y) < 3) return; // 过滤微小抖动
        trail.push({ x: p.x, y: p.y, t: performance.now() });
        if (performance.now() - lastSlash > 50) { S.slash(); lastSlash = performance.now(); } // 挥刀音
        checkCut(last, p);
    });
    function endPointer() {
        if (!dragging) return;
        dragging = false;         // 注意：不清空 trail，让刀光自然淡出
        endSwipe();
    }
    cv.addEventListener("pointerup", endPointer);
    cv.addEventListener("pointercancel", endPointer);
    cv.addEventListener("contextmenu", function (e) { e.preventDefault(); }); // 禁止右键菜单

    /* ============ 15. 计分 / HUD ============ */
    function updateHUD() {
        scoreEl.textContent = score;
        comboEl.textContent = comboHits > 0 ? "×" + comboHits : "-";
        timeEl.textContent = Math.ceil(Math.max(0, gameTime));
    }
    // 一次滑动结束：若本刀连切 >=2 个，结算连击奖励并弹出提示
    function endSwipe() {
        if (comboHits >= 2) {
            var bonus = comboHits * 5, cx = 0, cy = 0, i;
            for (i = 0; i < comboPts.length; i++) { cx += comboPts[i].x; cy += comboPts[i].y; }
            cx /= comboPts.length; cy /= comboPts.length;
            score += bonus;
            addPopup(cx, cy - 20, "连击 ×" + comboHits + "  +" + bonus, "#ffd54f", 24);
            S.combo(comboHits);
        }
        comboHits = 0; comboPts.length = 0;
        updateHUD();
    }

    /* ============ 16. 开始 / 结束 ============ */
    function refreshBest() {
        var key = "fruit_ninja_best_" + diffKey;
        var best = parseInt(localStorage.getItem(key) || "0", 10);
        if (score > best) { best = score; localStorage.setItem(key, best); }
        bestEl.textContent = best;
        ovBest.textContent = "当前难度最佳：" + best;
        return best;
    }
    function startGame() {
        S.resume();
        fruits = []; pieces = []; parts = []; popups = []; rings = []; trail = [];
        score = 0; comboHits = 0; comboPts = []; missed = 0;
        gameTime = DURATION; spawnTimer = 0; shakeT = 0; dragging = false;
        updateHUD();
        overlay.style.display = "none";
        playing = true;
    }
    function endGame(reason) {
        if (!playing) return;
        playing = false; dragging = false; trail.length = 0;
        var best = refreshBest();
        ovTitle.textContent = reason === "bomb" ? "💥 切到炸弹！" : (reason === "miss" ? "😵 漏掉太多水果" : "⏱ 时间到！");
        ovDesc.innerHTML = '本局得分 <b style="color:#ffd54f">' + score + "</b><br>最佳 <b style=\"color:#22c55e\">" + best +
            '</b> · 漏掉 ' + missed + " 个";
        overlay.style.display = "flex";
        S.over();
    }

    /* ============ 17. 难度按钮 ============ */
    var dbtns = document.querySelectorAll(".dbtn");
    dbtns.forEach(function (b) {
        if (b.dataset.d === diffKey) b.classList.add("on");
        b.addEventListener("click", function () {
            diffKey = b.dataset.d;
            localStorage.setItem("fruit_ninja_diff", diffKey);
            dbtns.forEach(function (x) { x.classList.remove("on"); });
            b.classList.add("on");
            refreshBest();
        });
    });
    startBtn.addEventListener("click", startGame);

    /* ============ 18. 主循环（requestAnimationFrame + 增量时间） ============ */
    function loop(t) {
        if (lastT < 0) lastT = t;
        var dt = Math.min((t - lastT) / 1000, 0.05); // 限制最大步长，切后台回来不跳帧
        lastT = t;
        if (playing) {
            gameTime -= dt;
            if (gameTime <= 0) { gameTime = 0; updateHUD(); endGame("time"); }
            else {
                spawnTimer -= dt;
                if (spawnTimer <= 0) { spawnTimer = DIFFS[diffKey].spawnInterval; spawnFruit(pickBurst(DIFFS[diffKey])); }
            }
        }
        update(dt);
        updateHUD();
        draw();
        requestAnimationFrame(loop);
    }

    refreshBest(); // 初始显示最佳成绩
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
