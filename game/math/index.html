<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>速算挑战</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:22px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .stat-row { display:flex; gap:10px; margin-bottom:14px; }
    .stat { flex:1; background:#16161b; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
    .stat .label { font-size:11px; color:var(--muted); }
    .stat .val { font-size:22px; font-weight:700; color:var(--accent); }
    .q { text-align:center; font-size:clamp(30px,8vw,40px); font-weight:800; color:var(--text); background:#16161b; border:1px solid var(--line); border-radius:14px; padding:22px 10px; margin-bottom:16px; letter-spacing:2px; }
    .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .opt { background:#3a3a44; border:1px solid var(--line); border-radius:14px; font-size:clamp(24px,7vw,32px); font-weight:700; color:var(--text); padding:20px 0; cursor:pointer; touch-action:manipulation; transition:.12s; user-select:none; -webkit-user-select:none; }
    .opt:active { transform:scale(.94); }
    .opt.right { background:#052e16; border-color:var(--accent); color:var(--accent); }
    .opt.wrong { background:#7f1d1d; border-color:#ef4444; color:#fecaca; }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    .wrap { position:relative; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(2,6,23,.84); border-radius:16px; text-align:center; padding:14px; }
    .overlay h2 { font-size:26px; line-height:1.5; }
    .btn { background:var(--accent); color:#052e16; border:none; padding:10px 28px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; }
    .diff-row { display:flex; gap:8px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 0; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>🧮 速算挑战</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="stat-row">
            <div class="stat"><div class="label">答对</div><div class="val" id="score">0</div></div>
            <div class="stat"><div class="label">连击</div><div class="val" id="combo">0</div></div>
            <div class="stat"><div class="label">剩余时间</div><div class="val" id="time">0</div></div>
        </div>
        <div class="q" id="question">—</div>
        <div class="opts" id="opts"></div>
        <div class="hint">限时内尽可能多答对 · 连击有加分 · 答错扣 1 分 · 难度随得分提升 · 手机 / 电脑点选即可</div>
    </div>
    <div class="overlay" id="overlay" style="position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(360px,88vw)">
        <h2 id="ovTitle">🧮 速算挑战</h2>
        <div style="font-size:13px; color:var(--muted); line-height:1.7">从四个选项中选出正确答案<br>答对 +1（连击加成），答错 -1，限时挑战</div>
        <div class="diff-row">
            <button class="dbtn" data-d="easy">简单</button>
            <button class="dbtn" data-d="normal">普通</button>
            <button class="dbtn" data-d="hard">困难</button>
        </div>
        <button class="btn" id="start">开始挑战</button>
    </div>

<script>
(function () {
    // 难度：限时 / 数字范围 / 运算种类（简单 90s 加减 / 普通 60s 加减乘 / 困难 45s 加减乘除）
    var DIFFS = {
        easy:   { dur: 90, base: 9,  maxRng: 30, maxLv: 8,  ops: ["+", "-"] },
        normal: { dur: 60, base: 9,  maxRng: 60, maxLv: 12, ops: ["+", "-", "×"] },
        hard:   { dur: 45, base: 12, maxRng: 99, maxLv: 20, ops: ["+", "-", "×", "÷"] }
    };
    var diffKey = localStorage.getItem("math_diff") || "normal";
    function initDiff() {
        var btns = document.querySelectorAll(".dbtn");
        btns.forEach(function (b) {
            if (b.dataset.d === diffKey) b.classList.add("on");
            b.addEventListener("click", function () {
                diffKey = b.dataset.d;
                localStorage.setItem("math_diff", diffKey);
                btns.forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
            });
        });
    }
    var qEl = document.getElementById("question"), optsEl = document.getElementById("opts"),
        scoreEl = document.getElementById("score"), comboEl = document.getElementById("combo"),
        timeEl = document.getElementById("time"), overlay = document.getElementById("overlay"),
        ovTitle = document.getElementById("ovTitle"), startBtn = document.getElementById("start");
    var score = 0, combo = 0, remain = DIFFS[diffKey].dur, running = false, timer, locked = false;

    function makeQuestion() {
        var D = DIFFS[diffKey];
        var lv = Math.min(Math.floor(score / 5), D.maxLv);      // 难度随得分提升
        var op = D.ops[Math.floor(Math.random() * D.ops.length)], a, b, ans, rng = Math.min(D.base + lv, D.maxRng);
        if (op === "+") { a = 1 + Math.floor(Math.random() * rng); b = 1 + Math.floor(Math.random() * rng); ans = a + b; }
        else if (op === "-") { a = 2 + Math.floor(Math.random() * rng); b = 1 + Math.floor(Math.random() * (a - 1)); ans = a - b; }
        else if (op === "×") { a = 1 + Math.floor(Math.random() * rng); b = 1 + Math.floor(Math.random() * (Math.min(rng, 12))); ans = a * b; }
        else { b = 2 + Math.floor(Math.random() * 8); var k = 2 + Math.floor(Math.random() * 9); a = b * k; ans = k; }
        // 干扰项：与答案接近且不重复
        var choices = [ans];
        while (choices.length < 4) {
            var d = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 8));
            var c = ans + d;
            if (choices.indexOf(c) === -1) choices.push(c);
        }
        // 打乱顺序
        for (var i = choices.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = choices[i]; choices[i] = choices[j]; choices[j] = t;
        }
        return { text: a + " " + op + " " + b + " = ?", ans: ans, choices: choices };
    }

    function render(q) {
        qEl.textContent = q.text;
        optsEl.innerHTML = "";
        q.choices.forEach(function (c) {
            var b = document.createElement("button");
            b.className = "opt"; b.textContent = c;
            b.addEventListener("pointerdown", function (e) { e.preventDefault(); }, { passive: false });
            b.addEventListener("click", function () { answer(b, c, q.ans); });
            optsEl.appendChild(b);
        });
    }

    function answer(btn, picked, ans) {
        if (!running || locked) return;
        locked = true;
        var ok = picked === ans;
        btn.classList.add(ok ? "right" : "wrong");
        // 标出正确答案
        if (!ok) {
            for (var i = 0; i < optsEl.children.length; i++)
                if (+optsEl.children[i].textContent === ans) optsEl.children[i].classList.add("right");
        }
        if (ok) {
            combo++;
            var gain = 1 + (combo >= 5 ? 2 : combo >= 3 ? 1 : 0);
            score += gain;
        } else { combo = 0; score = Math.max(0, score - 1); }
        scoreEl.textContent = score; comboEl.textContent = combo;
        setTimeout(function () {
            locked = false;
            if (running) render(makeQuestion());
        }, 350);
    }

    function end() {
        running = false; clearInterval(timer);
        ovTitle.textContent = "⏱ 时间到！答对 " + score + " 题";
        startBtn.textContent = "再来一局";
        overlay.style.display = "flex";
    }

    startBtn.addEventListener("click", function () {
        overlay.style.display = "none";
        score = 0; combo = 0; remain = DIFFS[diffKey].dur; running = true; locked = false;
        scoreEl.textContent = 0; comboEl.textContent = 0; timeEl.textContent = DIFFS[diffKey].dur;
        render(makeQuestion());
        timer = setInterval(function () {
            remain--; timeEl.textContent = remain;
            if (remain <= 0) end();
        }, 1000);
    });

    initDiff();
    overlay.style.display = "flex";
})();
</script>
</body>
</html>
