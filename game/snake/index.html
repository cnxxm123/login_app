<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:22px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .score-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .score-box { font-size:15px; color:var(--muted); }
    .score-box b { color:var(--accent); font-size:20px; margin-left:6px; }
    #board { display:block; background:#0b1220; border:1px solid var(--line); border-radius:8px; width:100%; max-width:480px; height:auto; touch-action:none; }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    .btn { background:var(--accent); color:#052e16; border:none; padding:8px 20px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover { filter:brightness(1.1); }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(2,6,23,.75); border-radius:8px; }
    .overlay h2 { font-size:26px; }
    .diff-row { display:flex; gap:8px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 0; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
    .wrap { position:relative; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>🐍 贪吃蛇</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="score-row">
            <div class="score-box">得分 <b id="score">0</b></div>
            <div class="score-box">长度 <b id="len">1</b></div>
        </div>
        <div class="wrap">
            <canvas id="board" width="480" height="480"></canvas>
            <div class="overlay" id="overlay">
                <h2>🐍 贪吃蛇</h2>
                <div class="diff-row">
                    <button class="dbtn" data-d="easy">简单</button>
                    <button class="dbtn" data-d="normal">普通</button>
                    <button class="dbtn" data-d="hard">困难</button>
                </div>
                <button class="btn" id="start">开始游戏</button>
            </div>
        </div>
        <div class="hint">方向键 / WASD 控制移动 · 吃🍎得分，每吃 5 个加速 · 撞墙或撞到自己则结束</div>
    </div>

<script>
(function () {
    var cv = document.getElementById("board");
    var ctx = cv.getContext("2d");
    var CELL = 24, ROWS = cv.height / CELL, COLS = cv.width / CELL;
    var scoreEl = document.getElementById("score");
    var lenEl = document.getElementById("len");
    var overlay = document.getElementById("overlay");

    var snake, dir, nextDir, food, score, speed, loop, running;

    // 难度：影响初始移动速度（ms/格）
    var DIFFS = { easy:{speed:200}, normal:{speed:150}, hard:{speed:110} };
    var diffKey = localStorage.getItem("snake_diff") || "normal";
    function initDiff() {
        var btns = document.querySelectorAll(".dbtn");
        btns.forEach(function (b) {
            if (b.dataset.d === diffKey) b.classList.add("on");
            b.addEventListener("click", function () {
                diffKey = b.dataset.d;
                localStorage.setItem("snake_diff", diffKey);
                btns.forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
            });
        });
    }

    function reset() {
        snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
        dir = { x: 1, y: 0 }; nextDir = dir;
        score = 0; speed = DIFFS[diffKey].speed;
        placeFood();
        draw();
    }

    function placeFood() {
        do {
            food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
    }

    function draw() {
        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, 0, cv.width, cv.height);
        // 网格
        ctx.strokeStyle = "rgba(148,163,184,.08)";
        for (var i = 1; i < COLS; i++) {
            ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
        }
        // 食物
        ctx.fillStyle = "#f87171";
        roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 7); ctx.fill();
        // 蛇
        for (var j = 0; j < snake.length; j++) {
            ctx.fillStyle = j === 0 ? "#22c55e" : "#16a34a";
            roundRect(snake[j].x * CELL + 1, snake[j].y * CELL + 1, CELL - 2, CELL - 2, 5); ctx.fill();
        }
        // 蛇眼
        var h = snake[0];
        ctx.fillStyle = "#052e16";
        ctx.fillRect(h.x * CELL + 5, h.y * CELL + 5, 4, 4);
        ctx.fillRect(h.x * CELL + 15, h.y * CELL + 5, 4, 4);
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function step() {
        dir = nextDir;
        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();
        for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = score;
            lenEl.textContent = snake.length;
            placeFood();
            if (score % 5 === 0) {
                speed = Math.max(60, speed - 12);
                clearInterval(loop); loop = setInterval(step, speed);
            }
        } else {
            snake.pop();
        }
        draw();
    }

    function gameOver() {
        clearInterval(loop); running = false;
        overlay.style.display = "flex";
        overlay.querySelector("h2").textContent = "游戏结束，得分 " + score;
        overlay.querySelector(".btn").textContent = "再来一局";
    }

    document.addEventListener("keydown", function (e) {
        var map = {
            ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
            w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
            W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
        };
        var nd = map[e.key];
        if (nd) {
            e.preventDefault();
            if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
        }
    });

    // 触屏滑动：带最小位移阈值，轻点/小幅度拖动不会误转向
    var tx, ty;
    cv.addEventListener("touchstart", function (e) {
        tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        e.preventDefault();
    }, { passive: false });
    cv.addEventListener("touchmove", function (e) {
        e.preventDefault();
    }, { passive: false });
    cv.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - tx;
        var dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;  // 位移太小视为点击，不转向
        var nd;
        if (Math.abs(dx) > Math.abs(dy)) nd = { x: dx > 0 ? 1 : -1, y: 0 };
        else nd = { x: 0, y: dy > 0 ? 1 : -1 };
        if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
    });

    initDiff();
    overlay.querySelector(".btn").addEventListener("click", function () {
        overlay.style.display = "none";
        reset();
        clearInterval(loop);
        running = true;
        loop = setInterval(step, speed);
    });

    reset();
})();
</script>
</body>
</html>
