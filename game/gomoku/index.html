<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:460px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:22px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .stat-row { display:flex; gap:10px; margin-bottom:14px; }
    .stat { flex:1; background:#16161b; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
    .stat .label { font-size:11px; color:var(--muted); }
    .stat .val { font-size:20px; font-weight:700; color:var(--accent); }
    #board { display:block; width:100%; max-width:460px; height:auto; touch-action:none; border-radius:12px;
        /* 仿木质棋盘：暖色渐变 + 顶部受光、四周内阴影，营造立体厚度 */
        background:
            radial-gradient(900px 380px at 50% -10%, rgba(255,235,190,.55), rgba(255,235,190,0) 62%),
            linear-gradient(165deg, #e7c890 0%, #d6ae6e 46%, #c69a58 100%);
        box-shadow:
            inset 0 3px 10px rgba(120,80,30,.38),
            inset 0 -3px 8px rgba(255,235,190,.28),
            inset 3px 0 8px rgba(120,80,30,.22),
            inset -3px 0 8px rgba(120,80,30,.22),
            0 12px 32px rgba(0,0,0,.45);
    }
    .ctrl { display:flex; gap:10px; margin-top:12px; }
    .btn { flex:1; background:var(--accent); color:#052e16; border:none; padding:10px 0; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; touch-action:manipulation; }
    .btn.alt { background:#475569; color:#e2e8f0; }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    .wrap { position:relative; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(2,6,23,.84); border-radius:12px; text-align:center; padding:14px; }
    .overlay h2 { font-size:26px; }
    .overlay .btn { width:auto; padding:10px 28px; }
    .diff-row { display:flex; gap:8px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 0; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>⚫ 五子棋</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="stat-row">
            <div class="stat"><div class="label">执子</div><div class="val" id="turn">⚫ 你</div></div>
            <div class="stat"><div class="label">对局</div><div class="val" id="round">0</div></div>
        </div>
        <div class="wrap">
            <canvas id="board"></canvas>
            <div class="overlay" id="overlay">
                <h2>⚫ 五子棋</h2>
                <div style="font-size:13px; color:var(--muted); line-height:1.7">你是黑子 ⚫，先手；AI 白子 ⚪<br>点击交叉点落子，五子连珠即获胜</div>
                <div class="diff-row">
                    <button class="dbtn" data-d="easy">简单</button>
                    <button class="dbtn" data-d="normal">普通</button>
                    <button class="dbtn" data-d="hard">困难</button>
                </div>
                <button class="btn" id="start">开始对局</button>
            </div>
        </div>
        <div class="ctrl">
            <button class="btn alt" id="restart">重新开始</button>
        </div>
        <div class="hint">你执黑先手，点击棋盘交叉点落子 · 与 AI 对弈，五子连珠获胜 · 手机点按 / 电脑点击均可</div>
    </div>

<script>
(function () {
    var N = 15, CELL = 28, M = 4 + (N - 1) * CELL;   // 棋盘逻辑尺寸 396x396（坐标系单位）
    var cv = document.getElementById("board"), ctx = cv.getContext("2d");
    // 高清适配：按设备像素比(DPR)放大画布物理分辨率，CSS 显示尺寸不变，
    // 让高分屏/手机上的棋盘和棋子更清晰不发虚（上限 3 倍，避免过大开销）。
    var DPR = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = M * DPR; cv.height = M * DPR;
    ctx.scale(DPR, DPR);  // 后续绘制继续用逻辑坐标（0~M），缩放交给画布
    var turnEl = document.getElementById("turn"), roundEl = document.getElementById("round"),
        overlay = document.getElementById("overlay"), startBtn = document.getElementById("start"),
        restartBtn = document.getElementById("restart");
    var EMPTY = 0, PLAYER = 1, AI = 2;
    var board, playing = false, moves = 0, lastMove = null;
    var hover = null;  // 当前悬停的交叉点 {r, c}（用于绘制落子虚影预览），null 表示无
    var DIRS = [[1,0],[0,1],[1,1],[1,-1]];

    // 难度：影响 AI 强度（简单随机 / 普通基础启发 / 困难高级评分）
    var DIFFS = { easy:1, normal:2, hard:3 };
    var diffKey = localStorage.getItem("gomoku_diff") || "normal";
    function initDiff() {
        var btns = document.querySelectorAll(".dbtn");
        btns.forEach(function (b) {
            if (b.dataset.d === diffKey) b.classList.add("on");
            b.addEventListener("click", function () {
                diffKey = b.dataset.d;
                localStorage.setItem("gomoku_diff", diffKey);
                btns.forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
            });
        });
    }

    function newBoard() { board = []; for (var i = 0; i < N; i++) board.push(new Array(N).fill(EMPTY)); }

    function lineLen(r, c, dr, dc, color) {
        // 从 (r,c) 沿方向统计连子数（假设 (r,c) 已落 color 子）
        var n = 1;
        for (var s = -1; s <= 1; s += 2) {
            var rr = r + dr * s, cc = c + dc * s;
            while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) {
                n++; rr += dr * s; cc += dc * s;
            }
        }
        return n;
    }
    function checkWin(r, c) {
        var color = board[r][c];
        for (var i = 0; i < DIRS.length; i++)
            if (lineLen(r, c, DIRS[i][0], DIRS[i][1], color) >= 5) return color;
        return 0;
    }
    function place(r, c) {
        board[r][c] = playing ? PLAYER : AI;
        moves++; lastMove = { r: r, c: c };
        draw();
        var w = checkWin(r, c);
        if (w) return end(w);
        if (moves >= N * N) return end(0);
        if (playing) { playing = false; turnEl.textContent = "⚪ AI"; aiTurn(); }
        else { playing = true; turnEl.textContent = "⚫ 你"; }
    }
    // 评估在某点落 color 子的价值：连子数 + 开放端权重（眼位）
    function aiEval(r, c, color) {
        var total = 0;
        for (var i = 0; i < DIRS.length; i++) {
            var dr = DIRS[i][0], dc = DIRS[i][1], n = 1, open = 0;
            var rr = r + dr, cc = c + dc;
            while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) { n++; rr += dr; cc += dc; }
            if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === EMPTY) open++;
            rr = r - dr; cc = c - dc;
            while (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === color) { n++; rr -= dr; cc -= dc; }
            if (rr >= 0 && rr < N && cc >= 0 && cc < N && board[rr][cc] === EMPTY) open++;
            if (n >= 5) total += 1000000;                 // 直接成五
            else if (open === 2) total += n * n * n * 10; // 双端开放，威胁大
            else if (open === 1) total += n * n * 10;
            else total += n;
        }
        return total;
    }
    function aiTurn() {
        var empties = [];
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++)
            if (board[r][c] === EMPTY) empties.push({ r: r, c: c });
        if (!empties.length) return;
        if (diffKey === "easy") {  // 简单：随机落子
            var p = empties[Math.floor(Math.random() * empties.length)];
            return setTimeout(function () { place(p.r, p.c); }, 320);
        }
        var best = null, bestScore = -1;
        for (var i = 0; i < empties.length; i++) {
            var r = empties[i].r, c = empties[i].c;
            var atk = aiEval(r, c, AI), def = aiEval(r, c, PLAYER);
            if (atk >= 1000000) { best = { r: r, c: c }; break; }           // 直接取胜
            var s = diffKey === "hard" ? atk * 1.15 + def : atk + def * 1.1;
            if (s > bestScore) { bestScore = s; best = { r: r, c: c }; }
        }
        setTimeout(function () { if (best) place(best.r, best.c); }, 320);
    }
    function end(w) {
        playing = false;
        var t;
        if (w === PLAYER) t = "🎉 你赢了！";
        else if (w === AI) t = "😵 AI 获胜";
        else t = "🤝 平局";
        overlay.querySelector("h2").textContent = t;
        startBtn.textContent = "再来一局";
        overlay.style.display = "flex";
    }
    function reset() {
        newBoard(); moves = 0; lastMove = null; playing = true;
        turnEl.textContent = "⚫ 你";
        roundEl.textContent = +roundEl.textContent + 1;
        draw();
    }
    // 画一枚立体棋子：黑/白用径向渐变 + 投影 + 左上高光，模拟瓷棋子质感
    function drawPiece(x, y, color) {
        ctx.save();
        ctx.shadowColor = "rgba(30,20,5,.45)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
        var g = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, 12);
        if (color === PLAYER) { g.addColorStop(0, "#4b5568"); g.addColorStop(1, "#0b1020"); }
        else { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#9aa7b8"); }
        ctx.beginPath(); ctx.arc(x, y, 12, 0, 7);
        ctx.fillStyle = g; ctx.fill();
        // 边缘描边，与木色棋盘区分
        ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = 1;
        ctx.strokeStyle = color === PLAYER ? "rgba(255,255,255,.14)" : "rgba(120,90,40,.5)";
        ctx.stroke();
        // 左上高光小点
        ctx.beginPath(); ctx.arc(x - 4, y - 4, 2.6, 0, 7);
        ctx.fillStyle = color === PLAYER ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.95)";
        ctx.fill();
        ctx.restore();
    }
    function draw() {
        ctx.clearRect(0, 0, M, M);
        // 网格线：深棕半透明，比纯灰更有"墨线刻木"质感
        ctx.strokeStyle = "rgba(88,58,24,.55)"; ctx.lineWidth = 1;
        for (var i = 0; i < N; i++) {
            ctx.beginPath(); ctx.moveTo(M / 2 - CELL * 7, M / 2 - CELL * 7 + i * CELL); ctx.lineTo(M / 2 + CELL * 7, M / 2 - CELL * 7 + i * CELL); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(M / 2 - CELL * 7 + i * CELL, M / 2 - CELL * 7); ctx.lineTo(M / 2 - CELL * 7 + i * CELL, M / 2 + CELL * 7); ctx.stroke();
        }
        // 星位
        ctx.fillStyle = "rgba(88,58,24,.8)";
        [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(function (p) {
            ctx.beginPath(); ctx.arc(M / 2 - CELL * 7 + p[0] * CELL, M / 2 - CELL * 7 + p[1] * CELL, 3.4, 0, 7); ctx.fill();
        });
        // 棋子
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
            if (board[r][c] === EMPTY) continue;
            var x = M / 2 - CELL * 7 + c * CELL, y = M / 2 - CELL * 7 + r * CELL;
            drawPiece(x, y, board[r][c]);
        }
        // 最后一手标记
        if (lastMove) {
            var lx = M / 2 - CELL * 7 + lastMove.c * CELL, ly = M / 2 - CELL * 7 + lastMove.r * CELL;
            ctx.save();
            ctx.shadowColor = "rgba(255,60,60,.8)"; ctx.shadowBlur = 8;
            ctx.fillStyle = "#ff5b5b";
            ctx.beginPath(); ctx.arc(lx, ly, 4.2, 0, 7); ctx.fill();
            ctx.restore();
        }
        // 悬停虚影：半透明棋子预览 + 柔光，提示"这里点下去会落在哪"
        if (hover && playing) {
            var hx = M / 2 - CELL * 7 + hover.c * CELL, hy = M / 2 - CELL * 7 + hover.r * CELL;
            // 外圈柔光
            ctx.save();
            ctx.shadowColor = "rgba(34,197,94,.8)"; ctx.shadowBlur = 18;
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, 7);
            ctx.fillStyle = "rgba(34,197,94,.22)"; ctx.fill();
            ctx.restore();
            // 半透明棋子虚影：与实棋子同款渐变，仅降低透明度
            ctx.save();
            ctx.globalAlpha = .5;
            var g2 = ctx.createRadialGradient(hx - 4, hy - 4, 2, hx, hy, 12);
            g2.addColorStop(0, "#4b5568"); g2.addColorStop(1, "#0b1020");
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, 7);
            ctx.fillStyle = g2; ctx.fill();
            ctx.restore();
        }
    }
    // 鼠标/触摸坐标 → 最近的交叉点 {r, c}；在棋盘外或不可落子时返回 null
    function cellFromEvent(e) {
        var rect = cv.getBoundingClientRect();
        var x = (e.clientX - rect.left) * (M / rect.width);
        var y = (e.clientY - rect.top) * (M / rect.height);
        var c = Math.round((x - (M / 2 - CELL * 7)) / CELL);
        var r = Math.round((y - (M / 2 - CELL * 7)) / CELL);
        if (r < 0 || r >= N || c < 0 || c >= N) return null;
        return { r: r, c: c };
    }
    // 悬停虚影：跟随鼠标/手指所在交叉点刷新预览（可落子才显示）
    cv.addEventListener("pointermove", function (e) {
        if (!playing || overlay.style.display !== "none") return;
        var cell = cellFromEvent(e);
        var next = (cell && board[cell.r][cell.c] === EMPTY) ? cell : null;
        if (next !== hover && (next || hover)) { hover = next; draw(); }
    }, { passive: true });
    // 离开棋盘时清除虚影
    cv.addEventListener("pointerleave", function () {
        if (hover) { hover = null; draw(); }
    }, { passive: true });
    // 点按落子：坐标换算到最近的交叉点
    cv.addEventListener("pointerdown", function (e) {
        if (!playing || overlay.style.display !== "none") return;
        var cell = cellFromEvent(e);
        if (!cell || board[cell.r][cell.c] !== EMPTY) return;
        hover = null;  // 落子前清掉虚影，避免残影
        place(cell.r, cell.c);
    }, { passive: true });

    startBtn.addEventListener("click", function () { overlay.style.display = "none"; reset(); });
    restartBtn.addEventListener("click", function () { overlay.style.display = "none"; reset(); });

    initDiff();
    newBoard(); draw();
    overlay.style.display = "flex";
})();
</script>
</body>
</html>
