<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打地鼠</title>
<style>
    :root { --bg:#16161b; --card:#24242b; --line:#3a3a44; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#16161b,#24242b); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
    .topbar { width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { font-size:22px; letter-spacing:1px; color:var(--accent); }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; border:1px solid var(--line); padding:6px 12px; border-radius:8px; transition:.2s; }
    .topbar a:hover { color:var(--text); border-color:var(--muted); }
    .panel { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .stat-row { display:flex; gap:10px; margin-bottom:14px; }
    .stat { flex:1; background:#16161b; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
    .stat .label { font-size:11px; color:var(--muted); }
    .stat .val { font-size:22px; font-weight:700; color:var(--accent); }
    .field { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .hole { aspect-ratio:1; border-radius:50%; background:#16161b; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
    .hole .m { font-size:clamp(36px,11vw,56px); line-height:1; }
    .hole.up { background:#052e16; border-color:var(--accent); }
    .hint { margin-top:12px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
    .wrap { position:relative; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(2,6,23,.84); border-radius:16px; text-align:center; padding:14px; }
    .overlay h2 { font-size:26px; }
    .diff-row { display:flex; gap:8px; }
    .dbtn { flex:1; background:#3a3a44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 0; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .dbtn.on { background:var(--accent); color:#052e16; border-color:var(--accent); font-weight:700; }
    .btn { background:var(--accent); color:#052e16; border:none; padding:10px 28px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; }
</style>
</head>
<body>
    <div class="topbar">
        <h1>🐹 打地鼠</h1>
        <a href="/game">← 返回游戏大厅</a>
    </div>
    <div class="panel">
        <div class="stat-row">
            <div class="stat"><div class="label">得分</div><div class="val" id="score">0</div></div>
            <div class="stat"><div class="label">剩余时间</div><div class="val" id="time">0</div></div>
            <div class="stat"><div class="label">最佳</div><div class="val" id="best">0</div></div>
        </div>
        <div class="wrap">
            <div class="field" id="field"></div>
            <div class="overlay" id="overlay">
                <h2 id="ovTitle">🐹 打地鼠</h2>
                <div style="font-size:13px; color:var(--muted); line-height:1.7">地鼠 🐹 冒头时快速点它！<br>打中越多得分越高</div>
                <div class="diff-row">
                    <button class="dbtn" data-d="easy">简单</button>
                    <button class="dbtn" data-d="normal">普通</button>
                    <button class="dbtn" data-d="hard">困难</button>
                </div>
                <button class="btn" id="start">开始游戏</button>
            </div>
        </div>
        <div class="hint">点击/轻触冒头的地鼠得分 · 只有地鼠 🐹 算分 · 手机、电脑均可直接点按</div>
    </div>

<script>
(function () {
    var N = 9, DUR = 30;           // 9 个洞，每局 30 秒
    var SPAWN = 620, UP_MS = 850;  // 生成间隔 / 地鼠停留时间
    var field = document.getElementById("field"), scoreEl = document.getElementById("score"),
        timeEl = document.getElementById("time"), bestEl = document.getElementById("best"),
        overlay = document.getElementById("overlay"), ovTitle = document.getElementById("ovTitle"),
        startBtn = document.getElementById("start");

    var best = +(localStorage.getItem("whack_best") || 0);
    bestEl.textContent = best;

    // 难度：简单 40 秒慢出鼠 / 普通 30 秒 / 困难 20 秒快出鼠
    var DIFFS = { easy:{dur:40,spawn:800,up:1100}, normal:{dur:30,spawn:620,up:850}, hard:{dur:20,spawn:450,up:650} };
    var diffKey = localStorage.getItem("whack_diff") || "normal";
    function initDiff() {
        var btns = document.querySelectorAll(".dbtn");
        btns.forEach(function (b) {
            if (b.dataset.d === diffKey) b.classList.add("on");
            b.addEventListener("click", function () {
                diffKey = b.dataset.d;
                localStorage.setItem("whack_diff", diffKey);
                btns.forEach(function (x) { x.classList.remove("on"); });
                b.classList.add("on");
            });
        });
    }

    var holes = [], up = [], score = 0, remain = DUR, running = false, spawnTimer, tickTimer, upTimer;

    // 生成 9 个洞
    for (var i = 0; i < N; i++) {
        (function (idx) {
            var d = document.createElement("div");
            d.className = "hole";
            d.innerHTML = '<span class="m">🕳️</span>';
            d.addEventListener("pointerdown", function (e) { e.preventDefault(); }, { passive: false });
            d.addEventListener("click", function () {
                if (!running || !up[idx]) return;
                clearTimeout(upTimer);
                d.classList.remove("up");
                d.querySelector(".m").textContent = "🕳️";
                up[idx] = false;
                score++; scoreEl.textContent = score;
                if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem("whack_best", best); }
            });
            field.appendChild(d);
            holes.push(d); up.push(false);
        })(i);
    }

    function show(idx) {
        var d = holes[idx];
        d.classList.add("up");
        d.querySelector(".m").textContent = "🐹";
        up[idx] = true;
        upTimer = setTimeout(function () {
            d.classList.remove("up");
            d.querySelector(".m").textContent = "🕳️";
            up[idx] = false;
        }, UP_MS);
    }

    function spawn() {
        if (!running) return;
        var free = [];
        for (var i = 0; i < N; i++) if (!up[i]) free.push(i);
        if (free.length) show(free[Math.floor(Math.random() * free.length)]);
        spawnTimer = setTimeout(spawn, SPAWN + Math.random() * 500);
    }

    function end() {
        running = false;
        clearInterval(tickTimer); clearTimeout(spawnTimer); clearTimeout(upTimer);
        for (var i = 0; i < N; i++) {
            holes[i].classList.remove("up");
            holes[i].querySelector(".m").textContent = "🕳️";
            up[i] = false;
        }
        ovTitle.textContent = "⏱ 时间到！得分 " + score;
        startBtn.textContent = "再来一局";
        overlay.style.display = "flex";
    }

    initDiff();
    startBtn.addEventListener("click", function () {
        overlay.style.display = "none";
        DUR = DIFFS[diffKey].dur; SPAWN = DIFFS[diffKey].spawn; UP_MS = DIFFS[diffKey].up;
        score = 0; remain = DUR; running = true;
        scoreEl.textContent = 0; timeEl.textContent = DUR;
        tickTimer = setInterval(function () {
            remain--; timeEl.textContent = remain;
            if (remain <= 0) end();
        }, 1000);
        spawn();
    });

    overlay.style.display = "flex";
})();
</script>
</body>
</html>
