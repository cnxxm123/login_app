<!-- 目录树侧栏（共享 partial）：显示完整目录结构，可折叠展开。
     通过 tree.js 异步加载节点数据，支持懒加载和记忆展开状态。
     在 main.html / view.html / search.html 中 nav.html 之后 include 使用。 -->

<!-- 树面板切换按钮：固定在侧栏与内容之间，点击切换树面板显隐 -->
<button class="tree-toggle" id="tree-toggle" type="button" title="显示/隐藏目录树" aria-label="切换目录树">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
    </svg>
</button>

<!-- 树面板：折叠时用 CSS 隐藏（transform 平移），展开时显示 -->
<div class="tree-panel" id="tree-panel" hidden>
    <div class="tree-header">
        <span class="tree-header-title">📂 目录</span>
        <button class="tree-header-close" type="button" onclick="toggleTree()" title="关闭目录树" aria-label="关闭目录树">✕</button>
    </div>
    <div class="tree-body">
        <ul class="tree-root" id="tree-root">
            <!-- 树节点由 tree.js 动态填充 -->
        </ul>
    </div>
</div>
