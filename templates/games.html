<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏大厅</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/games.css') }}">
</head>
<body>
    {% include 'nav.html' %}
    <div class="content">
        <div class="page-head">
            <div>
                <h2 class="page-title">游戏大厅</h2>
                <div class="tip">选择一个游戏，点击后在新标签页打开游玩 · 卡片右上角 🗑 可卸载（可还原）</div>
            </div>
        </div>
        {% if games %}
            <div class="game-grid">
                {% for g in games %}
                    <div class="game-card">
                        <a class="g-link" href="{{ g.url }}" target="_blank" rel="noopener" title="在新标签页打开 {{ g.display_name }}">
                            <span class="g-icon">{{ g.icon }}</span>
                            <span class="g-name">{{ g.display_name }}</span>
                            <span class="g-play">开始游戏 ▶</span>
                        </a>
                        <button class="g-del" type="button" onclick="uninstallGame('{{ g.name }}', '{{ g.display_name }}')" title="卸载 {{ g.display_name }}">🗑</button>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">游戏目录为空，请将游戏文件夹（内含 index.html）放入 game/ 目录</div>
        {% endif %}
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/games.js') }}"></script>
</body>
</html>
