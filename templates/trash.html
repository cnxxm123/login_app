<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回收站</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/trash.css') }}">
</head>
<body>
    {% include 'nav.html' %}
    <div class="content">
        <div class="page-head">
            <div>
                <h2 class="page-title">回收站</h2>
                <div class="tip">删除的内容会移到这里；还原后回到原位置，彻底删除则不可恢复。</div>
            </div>
        </div>
        {% if items %}
            <div class="toolbar">
                <button class="empty-btn" type="button" onclick="emptyTrash()">🗑 清空回收站</button>
            </div>
            <div class="trash-list">
                {% for it in items %}
                    <div class="trash-item">
                        <span class="ti-icon">{{ "📁" if it.is_dir else "📄" }}</span>
                        <div class="ti-info">
                            <div class="ti-name">{{ it.name }}</div>
                            <div class="ti-meta">
                                {% if it.original %}
                                    <span class="orig">原位置：{{ it.original }}</span><br>
                                {% endif %}
                                删除时间：{{ it.deleted_at or "未知" }}
                            </div>
                        </div>
                        <div class="ti-ops">
                            <button class="op-btn restore" type="button" title="还原" onclick="restoreItem('{{ it.name }}')">↩</button>
                            <button class="op-btn danger" type="button" title="彻底删除" onclick="deleteItem('{{ it.name }}')">✕</button>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">回收站是空的</div>
        {% endif %}
    </div>
    <!-- 通用弹窗：替代原生 confirm（沙箱 iframe 禁用） -->
    <div class="modal-mask" id="modal-mask" hidden>
        <div class="modal-box" role="dialog" aria-modal="true">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-msg" id="modal-msg"></div>
            <div class="modal-ops">
                <button class="modal-cancel" id="modal-cancel" type="button">取消</button>
                <button class="modal-ok" id="modal-ok" type="button">确定</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script>
        // ===== 页面配置：后端注入，供 trash.js 使用 =====
        window.TRASH_CONFIG = {
    urls: {
        restore: "{{ url_for('trash.restore', name='') }}",
        delete: "{{ url_for('trash.delete', name='') }}",
        empty: "{{ url_for('trash.empty') }}"
    }
};
    </script>
    <script src="{{ url_for('static', filename='js/trash.js') }}"></script>
</body>
</html>
